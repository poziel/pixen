[package]
name = "pixloom-desktop"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "pixloom"
path = "src/main.rs"

[dependencies]
pixloom = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
base64 = "0.23"

[build-dependencies]
tauri-build = { version = "2", features = [] }
