[package]
name = "pixloom"
version = "0.2.0"
edition = "2024"
default-run = "pixloom"
description = "Export explicit pixel art and build editable native sprite projects"
license = "MIT"
rust-version = "1.89"

autobins = false

[[bin]]
name = "pixloom-cli"
path = "src/main.rs"

[[bin]]
name = "pixloom"
path = "src/bin/pixloom.rs"

[[bin]]
name = "pixloom-mcp"
path = "src/bin/pixloom-mcp.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
flate2 = "1.1"
gif = "0.14"
rmcp = { version = "3.5.1", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
schemars = "1"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
base64 = "0.23"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Controls_Dialogs"] }
