[package]
name = "pixen"
version = "0.2.0"
edition = "2024"
default-run = "pixen-cli"
description = "Export explicit pixel art and build editable native sprite projects"
license = "MIT"
rust-version = "1.89"

autobins = false
autotests = false

[[bin]]
name = "pixen-cli"
path = "core/bin/pixen-cli.rs"

[[bin]]
name = "pixen-mcp"
path = "core/bin/pixen-mcp.rs"

[lib]
path = "core/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
flate2 = "1.1"
gif = "0.14"
rmcp = { version = "3.5.1", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "net"] }
getrandom = "0.3"
schemars = "1"
base64 = "0.23"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_UI_Controls_Dialogs", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
winresource = "0.1.34"

