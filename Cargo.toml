[package]
name = "spritex"
version = "0.2.0"
edition = "2024"
description = "Export explicit pixel art and build editable native sprite projects"
license = "MIT"
rust-version = "1.88"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
flate2 = "1.1"
gif = "0.14"
