[package]
name = "spritec"
version = "0.1.0"
edition = "2024"
description = "Compile explicit pixel art into editable Pixelorama PXO 7 projects"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
