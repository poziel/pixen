name: Headless tools checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Tools (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Configure GitHub npm registry authentication
        run: bun -e 'require("node:fs").appendFileSync(".npmrc", "\n//npm.pkg.github.com/:_authToken=\u0024{NODE_AUTH_TOKEN}\n")'
      - name: Install packaging dependencies
        run: bun install --ignore-scripts --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FRAME_PACKAGES_TOKEN || github.token }}
      - name: Check packaging scripts
        run: bun run check:scripts
      - name: Test packaging scripts
        run: bun test tests/scripts
      - name: Test Rust engine and tools
        run: cargo test --locked
      - name: Build tools
        run: cargo build --release --locked --bin pixen-cli --bin pixen-mcp
      - name: Package tools
        run: bun scripts/package-tools.ts --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: headless-tools-${{ matrix.target }}
          path: target/packages/*
          if-no-files-found: error
          retention-days: 14
