name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerequisites:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Check published dependencies and release version
        run: bun scripts/check-release-dependencies.ts

  desktop:
    needs: prerequisites
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Configure optional GitHub npm registry
        shell: pwsh
        env:
          FRAME_NPM_SCOPE: ${{ vars.FRAME_NPM_SCOPE }}
        run: |
          if ($env:FRAME_NPM_SCOPE) {
            if ($env:FRAME_NPM_SCOPE -notmatch '^@[a-z0-9][a-z0-9-]*$') { throw 'Invalid FRAME_NPM_SCOPE' }
            @(
              "$($env:FRAME_NPM_SCOPE):registry=https://npm.pkg.github.com",
              '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}'
            ) | Set-Content -LiteralPath .npmrc -Encoding utf8
          }
      - name: Install locked frontend dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FRAME_PACKAGES_TOKEN || github.token }}
        run: bun install --frozen-lockfile
      - name: Check frontend
        run: bun run check
      - name: Test frontend
        run: bun test tests/frontend
      - name: Test Rust engine
        run: cargo test --locked
      - name: Build CLI and MCP server
        run: bun run build:tools
      - name: Generate platform icons
        run: bun run tauri icon assets/pixen.png --output target/ci-icons
      - name: Enable release bundling
        run: bun scripts/prepare-release-config.ts
      - name: Build desktop and platform packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bun run tauri build --ci --config target/tauri.release.json --bundles ${{ matrix.bundles }} -- --locked
      - name: Package headless tools
        shell: pwsh
        run: ./scripts/package-tools.ps1 -Target '${{ matrix.target }}'
      - name: Package Windows editor and tools ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release.ps1 -PackageOnly
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            target/packages/*
            target/portable/*.zip
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: false
      - name: Publish prerelease and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p publish
          while IFS= read -r -d '' asset; do
            name=$(basename "$asset")
            test ! -e "publish/$name" || { echo "Duplicate asset: $name"; exit 1; }
            cp "$asset" "publish/$name"
          done < <(find release-assets -type f -print0)
          cd publish
          sha256sum * > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --verify-tag --prerelease --title "Pixen $RELEASE_TAG" --notes 'Automated preview build for Windows, macOS, and Linux. Desktop packages are unsigned; macOS packages are not notarized. Windows ZIP includes the editor, CLI, MCP server, and skills. Other platforms provide separate desktop installers and headless tools; MCP desktop preview integration on those platforms is not yet verified. External AI tools and FFmpeg are not included.'
